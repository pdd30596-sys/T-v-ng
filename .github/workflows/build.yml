          package vn.tuvung.app

          import android.content.Context

          class Word(val lessonId: Int, val idx: Int, val en: String, val vi: String) {
              val alts: List<String> = vi.split(";").map { it.trim() }.filter { it.isNotEmpty() }
              val primary: String get() = alts.firstOrNull() ?: vi
          }

          class Lesson(val id: Int, val level: String, val title: String) {
              val words = ArrayList<Word>()
          }

          object Vocab {
              private var cache: List<Lesson>? = null

              fun all(ctx: Context): List<Lesson> {
                  cache?.let { return it }
                  val res = ArrayList<Lesson>()
                  ctx.applicationContext.resources.openRawResource(R.raw.vocab)
                      .bufferedReader(Charsets.UTF_8).useLines { lines ->
                          var cur: Lesson? = null
                          for (raw in lines) {
                              val line = raw.trim()
                              if (line.isEmpty()) continue
                              if (line.startsWith("#")) {
                                  val p = line.substring(1).split("|", limit = 2)
                                  val l = Lesson(res.size, p[0].trim(), p.getOrElse(1) { "" }.trim())
                                  res.add(l)
                                  cur = l
                              } else {
                                  val c = cur ?: continue
                                  val p = line.split("|", limit = 2)
                                  if (p.size == 2) c.words.add(Word(c.id, c.words.size, p[0].trim(), p[1].trim()))
                              }
                          }
                      }
                  cache = res
                  return res
              }

              fun totalWords(ctx: Context): Int = all(ctx).sumOf { it.words.size }
          }
