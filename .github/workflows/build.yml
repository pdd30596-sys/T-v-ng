          package vn.tuvung.app

          import android.content.Context
          import android.content.SharedPreferences

          object Store {
              const val GOAL = 5

              private fun p(ctx: Context): SharedPreferences =
                  ctx.applicationContext.getSharedPreferences("vocab_progress", Context.MODE_PRIVATE)

              private fun key(w: Word) = "${w.lessonId}_${w.idx}"

              fun count(ctx: Context, w: Word): Int = p(ctx).getInt("c_" + key(w), 0)
              fun isDone(ctx: Context, w: Word): Boolean = count(ctx, w) >= GOAL
              fun boosted(ctx: Context, w: Word): Boolean = p(ctx).getBoolean("w_" + key(w), false)

              fun correct(ctx: Context, w: Word): Int {
                  val n = (count(ctx, w) + 1).coerceAtMost(GOAL)
                  p(ctx).edit().putInt("c_" + key(w), n).putBoolean("w_" + key(w), false).apply()
                  return n
              }

              fun wrong(ctx: Context, w: Word) {
                  p(ctx).edit().putBoolean("w_" + key(w), true).apply()
              }

              fun currentLesson(ctx: Context): Int {
                  val n = Vocab.all(ctx).size
                  return p(ctx).getInt("cur", 0).coerceIn(0, (n - 1).coerceAtLeast(0))
              }

              fun setCurrent(ctx: Context, id: Int) {
                  p(ctx).edit().putInt("cur", id).apply()
              }

              fun doneCount(ctx: Context, l: Lesson): Int = l.words.count { isDone(ctx, it) }
              fun lessonComplete(ctx: Context, l: Lesson): Boolean = l.words.all { isDone(ctx, it) }

              fun totalDone(ctx: Context): Int = Vocab.all(ctx).sumOf { doneCount(ctx, it) }

              fun nextIncompleteLesson(ctx: Context, after: Int): Int {
                  val ls = Vocab.all(ctx)
                  val n = ls.size
                  for (i in 1..n) {
                      val j = ((after + i) % n + n) % n
                      if (!lessonComplete(ctx, ls[j])) return j
                  }
                  return -1
              }

              fun allComplete(ctx: Context): Boolean = Vocab.all(ctx).all { lessonComplete(ctx, it) }

              fun resetLesson(ctx: Context, l: Lesson) {
                  val e = p(ctx).edit()
                  for (w in l.words) {
                      e.remove("c_" + key(w))
                      e.remove("w_" + key(w))
                  }
                  e.apply()
              }
          }
