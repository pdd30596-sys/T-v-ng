          package vn.tuvung.app

          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.View
          import android.widget.TextView
          import java.text.Normalizer

          object Text {
              private val marks = Regex("\\p{Mn}+")
              private val junk = Regex("[^a-z0-9 ]")
              private val spaces = Regex("\\s+")
              private val paren = Regex("\\([^)]*\\)")

              fun norm(s: String): String {
                  var t = s.lowercase().replace("đ", "d")
                  t = Normalizer.normalize(t, Normalizer.Form.NFD).replace(marks, "")
                  t = t.replace(junk, " ").replace(spaces, " ").trim()
                  return t
              }

              fun distance(a: String, b: String): Int {
                  if (a == b) return 0
                  if (a.isEmpty()) return b.length
                  if (b.isEmpty()) return a.length
                  var prev = IntArray(b.length + 1) { it }
                  var cur = IntArray(b.length + 1)
                  for (i in 1..a.length) {
                      cur[0] = i
                      for (j in 1..b.length) {
                          val c = if (a[i - 1] == b[j - 1]) 0 else 1
                          cur[j] = minOf(cur[j - 1] + 1, prev[j] + 1, prev[j - 1] + c)
                      }
                      val t = prev; prev = cur; cur = t
                  }
                  return prev[b.length]
              }

              fun matches(input: String, w: Word): Boolean {
                  val n = norm(input)
                  if (n.isEmpty()) return false
                  for (alt in w.alts) {
                      val variants = listOf(alt, alt.replace(paren, " "))
                      for (v in variants) {
                          val a = norm(v)
                          if (a.isEmpty()) continue
                          if (distance(n, a) <= a.length / 8) return true
                      }
                  }
                  return false
              }
          }

          object Ui {
              fun dp(ctx: Context, v: Int): Int = (v * ctx.resources.displayMetrics.density + 0.5f).toInt()

              fun bg(ctx: Context, color: Int, radiusDp: Int, strokeColor: Int = 0): GradientDrawable {
                  val d = GradientDrawable()
                  d.setColor(color)
                  d.cornerRadius = dp(ctx, radiusDp).toFloat()
                  if (strokeColor != 0) d.setStroke(dp(ctx, 1), strokeColor)
                  return d
              }

              fun tv(ctx: Context, text: String, sp: Float, color: Int, bold: Boolean = false): TextView {
                  val t = TextView(ctx)
                  t.text = text
                  t.textSize = sp
                  t.setTextColor(color)
                  if (bold) t.setTypeface(t.typeface, Typeface.BOLD)
                  return t
              }

              fun btn(ctx: Context, text: String, color: Int, onClick: () -> Unit): TextView {
                  val t = tv(ctx, text, 15f, Color.WHITE, true)
                  t.gravity = Gravity.CENTER
                  t.setPadding(dp(ctx, 14), dp(ctx, 12), dp(ctx, 14), dp(ctx, 12))
                  t.background = bg(ctx, color, 12)
                  t.isClickable = true
                  t.setOnClickListener { _: View -> onClick() }
                  return t
              }
          }
