          package vn.tuvung.app

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.util.TypedValue
          import android.view.View
          import android.widget.RemoteViews

          class VocabWidgetProvider : AppWidgetProvider() {

              override fun onUpdate(ctx: Context, mgr: AppWidgetManager, ids: IntArray) {
                  for (id in ids) mgr.updateAppWidget(id, build(ctx, mgr, id))
              }

              override fun onAppWidgetOptionsChanged(ctx: Context, mgr: AppWidgetManager, id: Int, newOptions: Bundle) {
                  mgr.updateAppWidget(id, build(ctx, mgr, id))
              }

              override fun onReceive(ctx: Context, intent: Intent) {
                  when (intent.action) {
                      ACTION_ANSWER -> {
                          Quiz.answer(ctx, intent.getIntExtra("serial", -1), intent.getIntExtra("choice", -1))
                          updateAll(ctx)
                      }
                      ACTION_SKIP -> {
                          Quiz.skip(ctx, intent.getIntExtra("serial", -1))
                          updateAll(ctx)
                      }
                      ACTION_SPEAK -> {
                          val serial = intent.getIntExtra("serial", -1)
                          val q = Quiz.current(ctx)
                          if (q != null && q.serial == serial) {
                              ctx.getSharedPreferences("vocab_quiz", Context.MODE_PRIVATE)
                                  .edit().putInt("pron_serial", serial).apply()
                              updateAll(ctx)
                              val en = Vocab.all(ctx)[q.lesson].words[q.idx].en
                              val pr = goAsync()
                              Speaker.speakThen(ctx, en) { pr.finish() }
                          }
                      }
                      else -> super.onReceive(ctx, intent)
                  }
              }

              companion object {
                  const val ACTION_ANSWER = "vn.tuvung.app.ANSWER"
                  const val ACTION_SKIP = "vn.tuvung.app.SKIP"
                  const val ACTION_SPEAK = "vn.tuvung.app.SPEAK"

                  fun updateAll(ctx: Context) {
                      val mgr = AppWidgetManager.getInstance(ctx)
                      val ids = mgr.getAppWidgetIds(ComponentName(ctx, VocabWidgetProvider::class.java))
                      for (id in ids) mgr.updateAppWidget(id, build(ctx, mgr, id))
                  }

                  private fun broadcast(ctx: Context, action: String, id: Int, slot: Int, serial: Int, choice: Int): PendingIntent {
                      val i = Intent(ctx, VocabWidgetProvider::class.java)
                      i.action = action
                      i.data = Uri.parse("tuvung://w/$id/$slot")
                      i.putExtra("serial", serial)
                      i.putExtra("choice", choice)
                      return PendingIntent.getBroadcast(
                          ctx, id * 10 + slot, i, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                  }

                  fun build(ctx: Context, mgr: AppWidgetManager, id: Int): RemoteViews {
                      val rv = RemoteViews(ctx.packageName, R.layout.widget_vocab)
                      val o = mgr.getAppWidgetOptions(id)
                      val w = o.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 250)
                      val h = o.getInt(AppWidgetManager.OPTION_APPWIDGET_MAX_HEIGHT, 180)

                      val openApp = PendingIntent.getActivity(
                          ctx, 9990 + id, Intent(ctx, MainActivity::class.java),
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                      rv.setOnClickPendingIntent(R.id.tv_lesson, openApp)

                      val lessons = Vocab.all(ctx)
                      val q = Quiz.current(ctx)
                      val opts = intArrayOf(R.id.opt0, R.id.opt1, R.id.opt2, R.id.opt3)

                      var wordSp = minOf(w / 9.0, h / 6.0).toFloat().coerceIn(16f, 38f)
                      rv.setViewVisibility(R.id.tv_info, if (h < 150) View.GONE else View.VISIBLE)

                      if (q == null) {
                          rv.setTextViewText(R.id.tv_lesson, "Từ vựng tiếng Anh")
                          rv.setTextViewText(R.id.tv_skip, "")
                          rv.setTextViewText(R.id.tv_speak, "")
                          rv.setViewVisibility(R.id.tv_pron, View.GONE)
                          rv.setTextViewText(R.id.tv_feedback, "")
                          rv.setTextViewText(R.id.tv_word, "🎉 Bạn đã hoàn thành tất cả các bài!")
                          rv.setTextViewTextSize(R.id.tv_word, TypedValue.COMPLEX_UNIT_SP, (wordSp * 0.6f).coerceAtLeast(14f))
                          rv.setTextViewText(R.id.tv_info, "Mở app để làm lại bài")
                          rv.setViewVisibility(R.id.row1, View.GONE)
                          rv.setViewVisibility(R.id.row2, View.GONE)
                          return rv
                      }

                      val l = lessons[q.lesson]
                      val word = l.words[q.idx]
                      rv.setViewVisibility(R.id.row1, View.VISIBLE)
                      rv.setViewVisibility(R.id.row2, View.VISIBLE)
                      rv.setTextViewText(R.id.tv_lesson, "Bài ${l.id + 1}: ${l.title}")
                      rv.setTextViewText(R.id.tv_skip, "Bỏ qua ⏭")
                      rv.setTextViewText(R.id.tv_speak, "🔊 Nghe")
                      rv.setOnClickPendingIntent(R.id.tv_speak, broadcast(ctx, ACTION_SPEAK, id, 6, q.serial, 0))
                      val showPron = ctx.getSharedPreferences("vocab_quiz", Context.MODE_PRIVATE)
                          .getInt("pron_serial", -1) == q.serial
                      val pt = if (showPron) PronData.text(ctx, word.en) else ""
                      if (pt.isNotEmpty()) {
                          rv.setTextViewText(R.id.tv_pron, pt)
                          rv.setTextViewTextSize(R.id.tv_pron, TypedValue.COMPLEX_UNIT_SP, if (h < 170) 11f else 13f)
                          rv.setViewVisibility(R.id.tv_pron, View.VISIBLE)
                      } else {
                          rv.setViewVisibility(R.id.tv_pron, View.GONE)
                      }
                      rv.setOnClickPendingIntent(R.id.tv_skip, broadcast(ctx, ACTION_SKIP, id, 5, q.serial, 0))

                      val fb = Quiz.feedback(ctx)
                      rv.setTextViewText(R.id.tv_feedback, fb)
                      rv.setTextColor(R.id.tv_feedback, if (Quiz.feedbackOk(ctx)) Color.parseColor("#86EFAC") else Color.parseColor("#FCA5A5"))

                      if (word.en.length > 24) wordSp *= 0.55f else if (word.en.length > 14) wordSp *= 0.7f
                      wordSp = wordSp.coerceAtLeast(13f)
                      rv.setTextViewText(R.id.tv_word, word.en)
                      rv.setTextViewTextSize(R.id.tv_word, TypedValue.COMPLEX_UNIT_SP, wordSp)

                      val done = Store.doneCount(ctx, l)
                      rv.setTextViewText(
                          R.id.tv_info,
                          "Xong $done/${l.words.size} từ • từ này ${Store.count(ctx, word)}/${Store.GOAL}"
                      )

                      val optSp = (wordSp * 0.5f).coerceIn(11f, 16f)
                      for (i in 0 until 4) {
                          val text = q.opts.getOrNull(i) ?: ""
                          rv.setTextViewText(opts[i], text)
                          rv.setTextViewTextSize(opts[i], TypedValue.COMPLEX_UNIT_SP, optSp)
                          rv.setOnClickPendingIntent(opts[i], broadcast(ctx, ACTION_ANSWER, id, i, q.serial, i))
                      }
                      return rv
                  }
              }
          }
