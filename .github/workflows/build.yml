name: Build APK Tu Vung

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tao ma nguon du an
        run: |
          mkdir -p "$HOME/proj" && cd "$HOME/proj"
          mkdir -p "app"
          cat > "app/build.gradle" <<'AMLICH_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'vn.tuvung.app'
              compileSdk 34

              defaultConfig {
                  applicationId "vn.tuvung.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }

              signingConfigs {
                  debug {
                      storeFile rootProject.file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          AMLICH_EOF
          mkdir -p "app/src/main"
          cat > "app/src/main/AndroidManifest.xml" <<'AMLICH_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".LessonActivity"
                      android:exported="false" />

                  <activity
                      android:name=".PracticeActivity"
                      android:exported="false"
                      android:windowSoftInputMode="adjustResize" />

                  <receiver
                      android:name=".VocabWidgetProvider"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_vocab_info" />
                  </receiver>
              </application>
          </manifest>
          AMLICH_EOF
          mkdir -p "app/src/main/java/vn/tuvung/app"
          cat > "app/src/main/java/vn/tuvung/app/LessonActivity.kt" <<'AMLICH_EOF'
          package vn.tuvung.app

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Toast

          class LessonActivity : Activity() {
              private lateinit var content: LinearLayout
              private var lid = 0

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  lid = intent.getIntExtra("id", 0)
                  val sv = ScrollView(this)
                  sv.setBackgroundColor(Color.parseColor("#F3F4F6"))
                  content = LinearLayout(this)
                  content.orientation = LinearLayout.VERTICAL
                  val pad = Ui.dp(this, 16)
                  content.setPadding(pad, pad, pad, pad)
                  sv.addView(content)
                  setContentView(sv)
              }

              override fun onResume() {
                  super.onResume()
                  render()
              }

              private fun lp(top: Int = 0, weight: Float = 0f): LinearLayout.LayoutParams {
                  val p = if (weight > 0f) LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, weight)
                  else LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  p.topMargin = Ui.dp(this, top)
                  return p
              }

              private fun render() {
                  content.removeAllViews()
                  val l = Vocab.all(this).getOrNull(lid) ?: return
                  content.addView(Ui.tv(this, "Bài ${l.id + 1}: ${l.title}", 22f, Color.parseColor("#111827"), true))
                  content.addView(
                      Ui.tv(this, "${l.level} • ${Store.doneCount(this, l)}/${l.words.size} từ xong", 13f, Color.parseColor("#6B7280")),
                      lp(4)
                  )

                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  val b1 = Ui.btn(this, "Luyện tập", Color.parseColor("#2563EB")) {
                      val i = Intent(this, PracticeActivity::class.java)
                      i.putExtra("id", lid)
                      startActivity(i)
                  }
                  val b2 = Ui.btn(this, "★ Dùng cho widget", Color.parseColor("#059669")) {
                      if (Store.lessonComplete(this, l)) {
                          Toast.makeText(this, "Bài này đã hoàn thành, hãy bấm Làm lại", Toast.LENGTH_SHORT).show()
                      } else {
                          Store.setCurrent(this, lid)
                          Quiz.generate(this)
                          VocabWidgetProvider.updateAll(this)
                          Toast.makeText(this, "Widget sẽ dùng bài này", Toast.LENGTH_SHORT).show()
                      }
                  }
                  val pl = lp(0, 1f)
                  pl.rightMargin = Ui.dp(this, 6)
                  val pr = lp(0, 1f)
                  pr.leftMargin = Ui.dp(this, 6)
                  row.addView(b1, pl)
                  row.addView(b2, pr)
                  content.addView(row, lp(12))

                  content.addView(Ui.btn(this, "Làm lại bài này", Color.parseColor("#DC2626")) {
                      Store.resetLesson(this, l)
                      Quiz.generate(this)
                      VocabWidgetProvider.updateAll(this)
                      render()
                  }, lp(8))

                  content.addView(Ui.tv(this, "Chạm vào từ để nghe phát âm", 12f, Color.parseColor("#6B7280")), lp(12))

                  for (w in l.words) {
                      val n = Store.count(this, w)
                      val box = LinearLayout(this)
                      box.orientation = LinearLayout.VERTICAL
                      val p = Ui.dp(this, 10)
                      box.setPadding(p, p, p, p)
                      box.background = Ui.bg(this, Color.WHITE, 10, Color.parseColor("#E5E7EB"))
                      val status = if (n >= Store.GOAL) "✓ xong" else "●".repeat(n) + "○".repeat(Store.GOAL - n)
                      box.addView(Ui.tv(this, w.en, 17f, Color.parseColor("#111827"), true))
                      val pr = PronData.get(this, w.en)
                      if (pr != null) box.addView(Ui.tv(this, pr.ipa + "  •  " + pr.boi, 12f, Color.parseColor("#B45309")), lp(2))
                      box.addView(Ui.tv(this, w.vi.replace(";", " /"), 14f, Color.parseColor("#374151")), lp(2))
                      box.addView(
                          Ui.tv(this, status, 12f, if (n >= Store.GOAL) Color.parseColor("#059669") else Color.parseColor("#9CA3AF")),
                          lp(2)
                      )
                      box.isClickable = true
                      box.setOnClickListener { Speaker.speak(this, w.en) }
                      content.addView(box, lp(6))
                  }
              }
          }
          AMLICH_EOF
          mkdir -p "app/src/main/java/vn/tuvung/app"
          cat > "app/src/main/java/vn/tuvung/app/MainActivity.kt" <<'AMLICH_EOF'
          package vn.tuvung.app

          import android.app.Activity
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private lateinit var content: LinearLayout

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val sv = ScrollView(this)
                  sv.setBackgroundColor(Color.parseColor("#F3F4F6"))
                  content = LinearLayout(this)
                  content.orientation = LinearLayout.VERTICAL
                  val pad = Ui.dp(this, 16)
                  content.setPadding(pad, pad, pad, pad)
                  sv.addView(content)
                  setContentView(sv)
              }

              override fun onResume() {
                  super.onResume()
                  render()
              }

              private fun lp(top: Int = 0): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  p.topMargin = Ui.dp(this, top)
                  return p
              }

              private fun render() {
                  content.removeAllViews()
                  val lessons = Vocab.all(this)
                  val total = Vocab.totalWords(this)
                  val done = Store.totalDone(this)

                  content.addView(Ui.tv(this, "Từ Vựng Tiếng Anh", 26f, Color.parseColor("#111827"), true))
                  content.addView(Ui.tv(this, "Đã thuộc $done/$total từ • ${lessons.size} bài", 14f, Color.parseColor("#4B5563")), lp(4))

                  content.addView(Ui.btn(this, "➕ Thêm widget ra màn hình chính", Color.parseColor("#2563EB")) { addWidget() }, lp(14))

                  content.addView(
                      Ui.tv(this, "Mỗi từ trả lời đúng ${Store.GOAL} lần là xong. Widget chỉ hiện từ của bài đang chọn (★) cho đến khi hết bài rồi tự sang bài kế.", 12f, Color.parseColor("#6B7280")),
                      lp(8)
                  )

                  val cur = Store.currentLesson(this)
                  var lastLevel = ""
                  for (l in lessons) {
                      if (l.level != lastLevel) {
                          lastLevel = l.level
                          content.addView(Ui.tv(this, l.level.uppercase(), 13f, Color.parseColor("#2563EB"), true), lp(20))
                      }
                      val d = Store.doneCount(this, l)
                      val full = Store.lessonComplete(this, l)
                      val box = LinearLayout(this)
                      box.orientation = LinearLayout.VERTICAL
                      val p = Ui.dp(this, 12)
                      box.setPadding(p, p, p, p)
                      val stroke = if (l.id == cur) Color.parseColor("#2563EB") else Color.parseColor("#E5E7EB")
                      box.background = Ui.bg(this, Color.WHITE, 12, stroke)
                      val star = if (l.id == cur) "★ " else ""
                      val tick = if (full) " ✓" else ""
                      box.addView(Ui.tv(this, "$star" + "Bài ${l.id + 1}: ${l.title}$tick", 16f, Color.parseColor("#111827"), true))
                      val sub: TextView = Ui.tv(this, "$d/${l.words.size} từ xong", 12f, Color.parseColor("#6B7280"))
                      box.addView(sub, lp(2))
                      box.isClickable = true
                      box.setOnClickListener {
                          val i = Intent(this, LessonActivity::class.java)
                          i.putExtra("id", l.id)
                          startActivity(i)
                      }
                      content.addView(box, lp(8))
                  }
              }

              private fun addWidget() {
                  val mgr = AppWidgetManager.getInstance(this)
                  if (mgr.isRequestPinAppWidgetSupported) {
                      mgr.requestPinAppWidget(ComponentName(this, VocabWidgetProvider::class.java), null, null)
                  } else {
                      Toast.makeText(this, "Nhấn giữ màn hình chính → Widget → Từ Vựng", Toast.LENGTH_LONG).show()
                  }
              }
          }
          AMLICH_EOF
          mkdir -p "app/src/main/java/vn/tuvung/app"
          cat > "app/src/main/java/vn/tuvung/app/PracticeActivity.kt" <<'AMLICH_EOF'
          package vn.tuvung.app

          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class PracticeActivity : Activity() {
              private var lid = 0
              private var cur: Word? = null
              private var answered = false
              private var finished = false
              private var lastIdx = -1

              private lateinit var tvProgress: TextView
              private lateinit var tvWord: TextView
              private lateinit var tvPron: TextView
              private lateinit var etAns: EditText
              private lateinit var tvResult: TextView
              private lateinit var btnMain: TextView
              private lateinit var btnHint: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  lid = intent.getIntExtra("id", 0)

                  val sv = ScrollView(this)
                  sv.setBackgroundColor(Color.parseColor("#F3F4F6"))
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  val pad = Ui.dp(this, 16)
                  root.setPadding(pad, pad, pad, pad)
                  sv.addView(root)

                  val l = Vocab.all(this).getOrNull(lid)
                  root.addView(Ui.tv(this, "Luyện tập – Bài ${lid + 1}: ${l?.title ?: ""}", 16f, Color.parseColor("#111827"), true))
                  tvProgress = Ui.tv(this, "", 13f, Color.parseColor("#6B7280"))
                  root.addView(tvProgress, lp(4))

                  tvWord = Ui.tv(this, "", 30f, Color.parseColor("#1D4ED8"), true)
                  tvWord.gravity = Gravity.CENTER
                  tvWord.setPadding(0, Ui.dp(this, 28), 0, Ui.dp(this, 8))
                  tvPron = Ui.tv(this, "", 14f, Color.parseColor("#B45309"))
                  tvPron.gravity = Gravity.CENTER
                  tvWord.setOnClickListener { cur?.let { Speaker.speak(this, it.en) } }
                  root.addView(tvWord, lp())
                  root.addView(tvPron, lp())
                  root.addView(
                      Ui.tv(this, "Gõ nghĩa tiếng Việt (có dấu hay không dấu đều được)", 12f, Color.parseColor("#6B7280")).also { it.gravity = Gravity.CENTER },
                      lp()
                  )

                  etAns = EditText(this)
                  etAns.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS
                  etAns.imeOptions = EditorInfo.IME_ACTION_DONE
                  etAns.setSingleLine(true)
                  etAns.textSize = 18f
                  etAns.setTextColor(Color.parseColor("#111827"))
                  etAns.background = Ui.bg(this, Color.WHITE, 10, Color.parseColor("#D1D5DB"))
                  val ep = Ui.dp(this, 12)
                  etAns.setPadding(ep, ep, ep, ep)
                  etAns.setOnEditorActionListener { _, _, _ ->
                      onMain()
                      true
                  }
                  root.addView(etAns, lp(14))

                  tvResult = Ui.tv(this, "", 16f, Color.parseColor("#111827"), true)
                  tvResult.gravity = Gravity.CENTER
                  root.addView(tvResult, lp(12))

                  btnMain = Ui.btn(this, "Kiểm tra", Color.parseColor("#2563EB")) { onMain() }
                  root.addView(btnMain, lp(14))
                  btnHint = Ui.btn(this, "Gợi ý", Color.parseColor("#6B7280")) { hint() }
                  root.addView(btnHint, lp(8))

                  setContentView(sv)
                  next()
              }

              private fun lp(top: Int = 0): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  p.topMargin = Ui.dp(this, top)
                  return p
              }

              private fun updateProgress() {
                  val l = Vocab.all(this)[lid]
                  val w = cur
                  val c = if (w != null) Store.count(this, w) else 0
                  tvProgress.text = "Xong ${Store.doneCount(this, l)}/${l.words.size} từ • từ này $c/${Store.GOAL}"
              }

              private fun next() {
                  answered = false
                  etAns.setText("")
                  tvResult.text = ""
                  btnMain.text = "Kiểm tra"
                  val w = Quiz.pickWord(this, lid, lastIdx)
                  if (w == null) {
                      finished = true
                      cur = null
                      tvPron.text = ""
                      tvWord.text = "🎉 Hoàn thành bài!"
                      tvWord.textSize = 24f
                      etAns.visibility = View.GONE
                      btnHint.visibility = View.GONE
                      btnMain.text = "Đóng"
                      updateProgress()
                      return
                  }
                  cur = w
                  lastIdx = w.idx
                  tvWord.text = w.en
                  tvPron.text = PronData.text(this, w.en)
                  updateProgress()
                  Speaker.speak(this, w.en)
              }

              private fun onMain() {
                  if (finished) {
                      finish()
                      return
                  }
                  if (answered) {
                      next()
                      return
                  }
                  val w = cur ?: return
                  val input = etAns.text.toString()
                  if (input.isBlank()) {
                      Toast.makeText(this, "Hãy nhập đáp án", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val ok = Text.matches(input, w)
                  Quiz.applyAnswer(this, w, ok)
                  Quiz.generate(this)
                  VocabWidgetProvider.updateAll(this)
                  answered = true
                  if (ok) {
                      tvResult.setTextColor(Color.parseColor("#059669"))
                      tvResult.text = "✔ Đúng! ${w.en} = ${w.vi.replace(";", " /")}"
                  } else {
                      tvResult.setTextColor(Color.parseColor("#DC2626"))
                      tvResult.text = "✘ Đáp án: ${w.vi.replace(";", " /")}"
                  }
                  btnMain.text = "Tiếp theo"
                  updateProgress()
              }

              private fun hint() {
                  val w = cur ?: return
                  if (answered) return
                  tvResult.setTextColor(Color.parseColor("#6B7280"))
                  tvResult.text = "Gợi ý: " + w.primary.split(" ").joinToString(" ") { it.take(1) + "…" }
              }
          }
          AMLICH_EOF
          mkdir -p "app/src/main/java/vn/tuvung/app"
          cat > "app/src/main/java/vn/tuvung/app/Pron.kt" <<'AMLICH_EOF'
          package vn.tuvung.app

          import android.content.Context

          class Pron(val ipa: String, val boi: String)

          object PronData {
              private var map: Map<String, Pron>? = null

              private fun load(ctx: Context): Map<String, Pron> {
                  map?.let { return it }
                  val m = HashMap<String, Pron>()
                  ctx.applicationContext.resources.openRawResource(R.raw.pron)
                      .bufferedReader(Charsets.UTF_8).useLines { lines ->
                          for (raw in lines) {
                              val p = raw.trim().split("|", limit = 3)
                              if (p.size == 3) m[p[0]] = Pron(p[1], p[2])
                          }
                      }
                  map = m
                  return m
              }

              fun get(ctx: Context, en: String): Pron? = load(ctx)[en]

              fun text(ctx: Context, en: String): String {
                  val p = get(ctx, en) ?: return ""
                  return p.ipa + "\nĐọc bồi: " + p.boi
              }
          }
          AMLICH_EOF
          mkdir -p "app/src/main/java/vn/tuvung/app"
          cat > "app/src/main/java/vn/tuvung/app/Quiz.kt" <<'AMLICH_EOF'
          package vn.tuvung.app

          import android.content.Context
          import android.content.SharedPreferences
          import kotlin.random.Random

          object Quiz {
              private const val SEP = "\u0001"

              class Q(val lesson: Int, val idx: Int, val serial: Int, val opts: List<String>, val correct: String)

              private fun p(ctx: Context): SharedPreferences =
                  ctx.applicationContext.getSharedPreferences("vocab_quiz", Context.MODE_PRIVATE)

              fun feedback(ctx: Context): String = p(ctx).getString("fb", "") ?: ""
              fun feedbackOk(ctx: Context): Boolean = p(ctx).getBoolean("fbOk", true)

              fun pickWord(ctx: Context, lessonId: Int, avoidIdx: Int): Word? {
                  val l = Vocab.all(ctx).getOrNull(lessonId) ?: return null
                  var cands = l.words.filter { !Store.isDone(ctx, it) }
                  if (cands.size > 1) cands = cands.filter { it.idx != avoidIdx }
                  if (cands.isEmpty()) return null
                  val weights = cands.map { w ->
                      var x = Store.GOAL - Store.count(ctx, w) + 1
                      if (Store.boosted(ctx, w)) x *= 3
                      x
                  }
                  var r = Random.nextInt(weights.sum())
                  for (i in cands.indices) {
                      r -= weights[i]
                      if (r < 0) return cands[i]
                  }
                  return cands.last()
              }

              private fun readQ(ctx: Context): Q? {
                  val sp = p(ctx)
                  val lesson = sp.getInt("q_lesson", -1)
                  if (lesson < 0) return null
                  val opts = (sp.getString("q_opts", "") ?: "").split(SEP).filter { it.isNotEmpty() }
                  if (opts.size < 2) return null
                  return Q(lesson, sp.getInt("q_idx", 0), sp.getInt("q_serial", 0), opts, sp.getString("q_correct", "") ?: "")
              }

              fun current(ctx: Context): Q? {
                  if (Store.allComplete(ctx)) return null
                  val q = readQ(ctx)
                  if (q != null && q.lesson == Store.currentLesson(ctx)) {
                      val w = Vocab.all(ctx).getOrNull(q.lesson)?.words?.getOrNull(q.idx)
                      if (w != null && !Store.isDone(ctx, w)) return q
                  }
                  return generate(ctx)
              }

              fun generate(ctx: Context): Q? {
                  val lessons = Vocab.all(ctx)
                  if (lessons.isEmpty()) return null
                  var cur = Store.currentLesson(ctx)
                  if (Store.lessonComplete(ctx, lessons[cur])) {
                      val n = Store.nextIncompleteLesson(ctx, cur)
                      if (n < 0) {
                          p(ctx).edit().putInt("q_lesson", -1).apply()
                          return null
                      }
                      cur = n
                      Store.setCurrent(ctx, n)
                  }
                  val sp = p(ctx)
                  val last = if (sp.getInt("q_lesson", -1) == cur) sp.getInt("q_last", -1) else -1
                  val w = pickWord(ctx, cur, last) ?: return null

                  val bad = HashSet<String>()
                  for (a in w.alts) bad.add(Text.norm(a))
                  val chosen = ArrayList<String>()
                  fun take(pool: List<Word>) {
                      for (d in pool.shuffled()) {
                          if (chosen.size >= 3) return
                          if (d.lessonId == w.lessonId && d.idx == w.idx) continue
                          val n = Text.norm(d.primary)
                          if (n.isEmpty() || n in bad) continue
                          bad.add(n)
                          chosen.add(d.primary)
                      }
                  }
                  take(lessons[cur].words)
                  if (chosen.size < 3) take(lessons.flatMap { it.words })

                  val opts = ArrayList<String>(chosen)
                  opts.add(w.primary)
                  opts.shuffle()
                  val serial = sp.getInt("q_serial", 0) + 1
                  sp.edit()
                      .putInt("q_lesson", cur)
                      .putInt("q_idx", w.idx)
                      .putInt("q_serial", serial)
                      .putString("q_opts", opts.joinToString(SEP))
                      .putString("q_correct", w.primary)
                      .apply()
                  return Q(cur, w.idx, serial, opts, w.primary)
              }

              fun answer(ctx: Context, serial: Int, choice: Int) {
                  val q = readQ(ctx) ?: return
                  if (q.serial != serial) return
                  val w = Vocab.all(ctx).getOrNull(q.lesson)?.words?.getOrNull(q.idx) ?: return
                  val ok = q.opts.getOrNull(choice) == q.correct
                  applyAnswer(ctx, w, ok)
                  p(ctx).edit().putInt("q_last", w.idx).apply()
                  generate(ctx)
              }

              fun skip(ctx: Context, serial: Int) {
                  val q = readQ(ctx) ?: return
                  if (q.serial != serial) return
                  val w = Vocab.all(ctx).getOrNull(q.lesson)?.words?.getOrNull(q.idx) ?: return
                  p(ctx).edit()
                      .putString("fb", "⏭ ${w.en} = ${w.primary}")
                      .putBoolean("fbOk", true)
                      .putInt("q_last", w.idx)
                      .apply()
                  generate(ctx)
              }

              fun applyAnswer(ctx: Context, w: Word, ok: Boolean): String {
                  val l = Vocab.all(ctx)[w.lessonId]
                  val msg: String
                  if (ok) {
                      val n = Store.correct(ctx, w)
                      var m = "✔ ${w.en} = ${w.primary} ($n/${Store.GOAL})"
                      if (n >= Store.GOAL) m += " – xong!"
                      if (Store.lessonComplete(ctx, l)) {
                          m = "🎉 Hoàn thành bài ${l.id + 1}!"
                          if (Store.currentLesson(ctx) == l.id) {
                              val nx = Store.nextIncompleteLesson(ctx, l.id)
                              if (nx >= 0) {
                                  Store.setCurrent(ctx, nx)
                                  m += " Sang bài ${nx + 1}"
                              } else {
                                  m += " Bạn đã xong tất cả!"
                              }
                          }
                      }
                      msg = m
                  } else {
                      Store.wrong(ctx, w)
                      msg = "✘ ${w.en} = ${w.primary}"
                  }
                  p(ctx).edit().putString("fb", msg).putBoolean("fbOk", ok).apply()
                  return msg
              }
          }
