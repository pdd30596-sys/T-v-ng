          package vn.tuvung.app

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import java.util.Locale

          object Speaker {
              private var tts: TextToSpeech? = null
              private var ready = false
              private var pending: String? = null
              private var onDone: (() -> Unit)? = null
              private val main = Handler(Looper.getMainLooper())

              private fun finishCb() {
                  val cb = onDone
                  onDone = null
                  if (cb != null) cb()
              }

              private fun doSpeak(text: String) {
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "u")
              }

              fun speak(ctx: Context, text: String) {
                  speakThen(ctx, text, null)
              }

              /** Đọc text, gọi done khi đọc xong (hoặc sau tối đa 6 giây). */
              fun speakThen(ctx: Context, text: String, done: (() -> Unit)?) {
                  finishCb()
                  onDone = done
                  if (done != null) main.postDelayed({ finishCb() }, 6000)
                  val t = tts
                  if (t == null) {
                      pending = text
                      tts = TextToSpeech(ctx.applicationContext) { status ->
                          if (status == TextToSpeech.SUCCESS) {
                              tts?.language = Locale.US
                              tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                                  override fun onStart(utteranceId: String?) {}
                                  override fun onDone(utteranceId: String?) {
                                      main.post { finishCb() }
                                  }

                                  @Deprecated("Deprecated in Java")
                                  override fun onError(utteranceId: String?) {
                                      main.post { finishCb() }
                                  }
                              })
                              ready = true
                              pending?.let { doSpeak(it) }
                              pending = null
                          } else {
                              main.post { finishCb() }
                          }
                      }
                  } else if (ready) {
                      doSpeak(text)
                  } else {
                      pending = text
                  }
              }
          }
